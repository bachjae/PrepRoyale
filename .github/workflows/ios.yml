name: iOS Build

on:
  push:
    branches: [master, main, clean-master]
  pull_request:
    branches: [master, main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  build-ios:
    name: Build & Archive iOS
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Restore GoogleService-Info.plist from GitHub Secret ───────────────
      # In your repo: Settings → Secrets → Actions → New secret
      #   Name:  GOOGLE_SERVICE_INFO_PLIST
      #   Value: base64-encoded content of ios/Runner/GoogleService-Info.plist
      # Generate the value with: base64 -i ios/Runner/GoogleService-Info.plist
      - name: Restore GoogleService-Info.plist
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > ios/Runner/GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}

      # ── 3. Flutter setup ─────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # ── 3. CocoaPods ─────────────────────────────────────────────────────────
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
        env:
          # Silence CocoaPods analytics
          COCOAPODS_DISABLE_STATS: 'true'

      # ── 4. Static analysis (catches Dart errors before building) ──────────────
      - name: Dart analyze
        run: dart analyze lib/

      # ── 5. Build (unsigned — no Apple Developer account required) ─────────────
      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign

      # ── 6. Archive the .app for download ─────────────────────────────────────
      - name: Archive .app
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r "build/ios/iphoneos/Runner.app" "build/ios/iphoneos/Payload/"
          cd build/ios/iphoneos
          zip -r PrepRoyale-unsigned.ipa Payload/

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PrepRoyale-unsigned-ipa
          path: build/ios/iphoneos/PrepRoyale-unsigned.ipa
          retention-days: 14

